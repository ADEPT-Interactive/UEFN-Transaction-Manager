name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:all
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -SkipTests
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-entitlement-manager-windows-x64
          path: |
            release/UEFN-Entitlement-Manager-Setup-*.exe
            release/UEFN-Entitlement-Manager-*-Portable.zip
            release/UEFN-Entitlement-Manager-Setup.exe
            release/UEFN-Entitlement-Manager-Portable.zip
            release/latest.yml
            release/UEFN-Entitlement-Manager-Setup-4.0.0.exe.blockmap
            release/SHA256SUMS.txt
            release/UEFN Entitlement Manager.contents.tsv
