name: CI

# What runs when (see "CI policy" in CONTRIBUTING.md):
# - Draft pull requests: nothing. Mark the pull request ready to run CI once.
# - Ready pull requests and pushes to main: the full test and package build.
# - Any other branch, or a draft: run it by hand (Actions > CI > Run workflow).
# Release tags are handled by release.yml, not here.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels its older run. Other runs get a group of
# their own, so runs on main are never cancelled and every main commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:all
      - run: npm run test:ui-renderer
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -SkipTests
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uefn-transaction-manager-windows-x64
          # About 500 MB per run; long enough to download and test a build.
          retention-days: 14
          path: |
            release/UEFN-Transaction-Manager-Setup-*.exe
            release/UEFN-Transaction-Manager-*-Portable.zip
            release/UEFN-Transaction-Manager-Installer.exe
            release/UEFN-Transaction-Manager-Portable.zip
            release/portable-latest.json
            release/latest.yml
            release/UEFN-Transaction-Manager-Setup-*.exe.blockmap
            release/SHA256SUMS.txt
            release/UEFN Transaction Manager.contents.tsv
