name: CI

on:
  push:
    # Keep all branch pushes; a tags-ignore filter alone would disable them.
    branches:
      - '**'
    tags-ignore:
      - 'archive/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:all
      - run: npm run test:ui-renderer
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -SkipTests
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uefn-transaction-manager-windows-x64
          path: |
            release/UEFN-Transaction-Manager-Setup-*.exe
            release/UEFN-Transaction-Manager-*-Portable.zip
            release/UEFN-Transaction-Manager-Installer.exe
            release/UEFN-Transaction-Manager-Portable.zip
            release/portable-latest.json
            release/latest.yml
            release/UEFN-Transaction-Manager-Setup-*.exe.blockmap
            release/SHA256SUMS.txt
            release/UEFN Transaction Manager.contents.tsv
