name: Build UEFN Transaction Manager release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run install:electron-runtime
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1
      - name: Stage and verify immutable R2 update objects
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADEPT_UPDATES_R2_ACCESS_KEY_ID: ${{ secrets.ADEPT_UPDATES_R2_ACCESS_KEY_ID }}
          ADEPT_UPDATES_R2_SECRET_ACCESS_KEY: ${{ secrets.ADEPT_UPDATES_R2_SECRET_ACCESS_KEY }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          node scripts/publish-updates.mjs stage --version $version --bucket adept-software-updates --prefix uem/stable --public-url https://updates.adeptinteractive.net/ --release-directory release
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version.json v$version." }
          $assets = @(
            "release/UEFN-Transaction-Manager-Setup.exe",
            "release/UEFN-Transaction-Manager-Portable.zip"
          )
          $notes = @"
          # UEFN Transaction Manager $version

          ## Download

          **Windows Installer, recommended**

          `UEFN-Transaction-Manager-Setup.exe`

          **Portable version**

          `UEFN-Transaction-Manager-Portable.zip`

          ## What's changed

          - UEFN Entitlement Manager is now UEFN Transaction Manager.
          - The broader name reflects management of UEFN in-island transactions, offers, bundles, storefronts, generated Verse APIs, and ownership helpers.
          - Existing project data remains compatible; no managed project conversion is required.
          - Existing installations can upgrade normally, and updater/backend compatibility remains on the established ADEPT update path.
          - The application icon and distribution identity now use the Transaction Manager branding.

          ## Windows SmartScreen

          The installer is currently unsigned. Windows may show an unrecognized-publisher warning.

          ## SHA-256

          Installer: `$((Get-FileHash release/UEFN-Transaction-Manager-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant())`

          Portable: `$((Get-FileHash release/UEFN-Transaction-Manager-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant())`
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding UTF8
          $existingJson = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          $viewExitCode = $LASTEXITCODE
          $existing = if ($viewExitCode -eq 0) { $existingJson | ConvertFrom-Json } else { $null }
          if ($viewExitCode -eq 0 -and -not $existing.isDraft) { throw "A public release already exists for $env:GITHUB_REF_NAME; refusing to mutate it." }
          if ($viewExitCode -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --title "UEFN Transaction Manager $version" --notes-file release-notes.md
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "UEFN Transaction Manager $version" --notes-file release-notes.md
          }
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-transaction-manager-${{ github.ref_name }}-internal-release-metadata
          path: |
            release/latest.yml
            release/UEFN-Transaction-Manager-Setup-*.exe.blockmap
            release/SHA256SUMS.txt
            release/UEFN Transaction Manager.contents.tsv
            release/UEFN-Transaction-Manager-Setup-*.exe
            release/UEFN-Transaction-Manager-*-Portable.zip
