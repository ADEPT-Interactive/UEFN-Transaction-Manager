name: Prune obsolete UTM update files

on:
  workflow_dispatch:
    inputs:
      version:
        description: Current published stable version (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: utm-stable-r2-publication
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Verify current payload and prune obsolete R2 files
        env:
          VERSION: ${{ inputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADEPT_UPDATES_R2_ACCESS_KEY_ID: ${{ secrets.ADEPT_UPDATES_R2_ACCESS_KEY_ID }}
          ADEPT_UPDATES_R2_SECRET_ACCESS_KEY: ${{ secrets.ADEPT_UPDATES_R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-updates.mjs prune --version "$VERSION" --apply true
