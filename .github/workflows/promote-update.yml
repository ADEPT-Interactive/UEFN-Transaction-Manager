name: Promote published UEFN Transaction Manager update

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: utm-stable-r2-publication
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Verify, promote feeds, and prune obsolete R2 update files
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADEPT_UPDATES_R2_ACCESS_KEY_ID: ${{ secrets.ADEPT_UPDATES_R2_ACCESS_KEY_ID }}
          ADEPT_UPDATES_R2_SECRET_ACCESS_KEY: ${{ secrets.ADEPT_UPDATES_R2_SECRET_ACCESS_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-updates.mjs promote \
            --version "$VERSION" \
            --bucket adept-software-updates \
            --prefix uem/stable \
            --public-url https://updates.adeptinteractive.net/ \
            --github-installer-url "https://github.com/ADEPT-Interactive/UEFN-Transaction-Manager/releases/latest/download/UEFN-Transaction-Manager-Installer.exe"
