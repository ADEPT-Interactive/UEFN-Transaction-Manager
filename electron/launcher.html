<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>UEFN Entitlement Manager</title>
  <style>
    :root{--bg:#080c14;--header:#080d19;--card:#0f1629;--hover:#15203b;--border:#1e293b;--cyan:#38bdf8;--muted:#94a3b8;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden}.titlebar{height:32px;background:var(--header);display:flex;align-items:stretch;-webkit-app-region:drag}.titlebar-title{display:flex;align-items:center;padding-left:12px;color:#64748b;font-size:10px;font-weight:700;letter-spacing:.08em}.drag{flex:1}.window-button{width:42px;border:0;background:transparent;color:#94a3b8;font-size:16px;cursor:pointer;-webkit-app-region:no-drag}.window-button:hover{background:#1e293b;color:#fff}.window-button.close{color:#fb7185}.window-button.close:hover{background:#e11d48;color:#fff}header{height:104px;border-bottom:1px solid rgba(30,41,59,.8);background:rgba(8,13,25,.96);padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:13px;min-width:0}.uem-mark{width:44px;height:44px;border-radius:12px}.identity h1{margin:0;font-size:18px;line-height:22px;font-weight:800;letter-spacing:-.02em}.identity p{margin:4px 0 0;color:var(--muted);font-size:12px}.project-chip{display:inline-flex;align-items:center;gap:6px;margin-top:7px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.1);border-radius:8px;padding:3px 8px;color:#7dd3fc;font-size:10px;font-weight:700}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.adept{display:flex;align-items:center;gap:10px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.07);border-radius:12px;padding:8px 12px;color:white;text-decoration:none}.adept:hover{border-color:rgba(56,189,248,.7);background:rgba(56,189,248,.1)}.adept-logo{width:28px;height:26px;overflow:hidden;flex:none}.adept-logo img{display:block;width:28px;height:28px;object-fit:contain;transform:scaleY(1.5)}.adept small{display:block;color:#64748b;font-size:9px;font-weight:700;letter-spacing:.12em}.adept strong{display:block;margin-top:2px;font-size:12px;letter-spacing:.03em}.shell{height:calc(100vh - 136px);display:flex;flex-direction:column;padding:22px 30px 18px;gap:14px}.panel{border:1px solid var(--border);background:rgba(15,22,41,.78);border-radius:12px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.18)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;font-size:14px;font-weight:800}.panel-head span{color:#64748b;font-size:11px}.tools{display:flex;gap:9px}.search{height:38px;flex:1;border:1px solid #334155;border-radius:8px;background:#020617;color:#fff;padding:0 12px;font:inherit;outline:0}.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}button.action{height:38px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#e2e8f0;padding:0 13px;font:700 12px inherit;cursor:pointer}button.action:hover{background:#334155}button:disabled{opacity:.45;cursor:not-allowed}.projects{min-height:0;flex:1;overflow:auto;padding:2px}.projects::-webkit-scrollbar{width:8px}.projects::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}.project{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 14px;text-align:left;color:inherit;cursor:pointer;margin-bottom:9px;transition:.12s}.project:hover{background:var(--hover);border-color:rgba(56,189,248,.35)}.project.selected{border-color:rgba(56,189,248,.65);background:rgba(56,189,248,.1)}.project-name{font-weight:800;font-size:13px}.project-path{margin-top:4px;color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{margin-top:7px;color:#64748b;font-size:11px;font-weight:700}.project.selected .project-meta{color:#7dd3fc}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:14px 16px}.footer h3{margin:0;font-size:13px}.footer p{margin:5px 0 0;color:var(--muted);font-size:11px}.footer .python{color:var(--green);font-weight:700}.primary{height:42px;min-width:190px;border:0;border-radius:8px;background:linear-gradient(90deg,#38bdf8,#3b82f6);color:#020617;font:800 12px inherit;cursor:pointer;box-shadow:0 8px 22px rgba(56,189,248,.18)}.primary:hover{background:linear-gradient(90deg,#67e8f9,#60a5fa)}.empty{display:flex;min-height:120px;align-items:center;justify-content:center;border:1px dashed #334155;border-radius:12px;color:#64748b;font-size:12px}@media(max-width:720px){header{padding:14px 18px}.adept{display:none}.shell{padding:14px 18px}.footer{align-items:flex-start;flex-direction:column}.primary{width:100%}}
  </style>
</head>
<body data-uem-launcher-ready>
  <div class="titlebar"><span class="titlebar-title">UEM</span><div class="drag"></div><button id="minimize" class="window-button" aria-label="Minimize">−</button><button id="maximize" class="window-button" aria-label="Maximize">□</button><button id="close" class="window-button close" aria-label="Close">×</button></div>
  <header><div class="identity"><img class="uem-mark" src="/uem-icon.svg" alt="UEM"><div><h1>UEFN Entitlement Manager</h1><p>Choose the UEFN project you want to manage.</p><span class="project-chip"><span class="dot"></span>PROJECT LINK</span></div></div><a id="adept" class="adept" href="https://adeptinteractive.net"><span class="adept-logo"><img src="/adept-insignia.png" alt=""></span><span><small>CREATED BY</small><strong>ADEPT INTERACTIVE ↗</strong></span></a></header>
  <main class="shell"><section class="panel"><div class="panel-head"><div><h2>Available projects</h2><span id="status">Finding active and recent UEFN projects…</span></div></div><div class="tools"><input id="search" class="search" placeholder="Search projects" autocomplete="off"><button id="browse" class="action">Browse for .uefnproject</button></div></section><section id="projects" class="projects" aria-live="polite"></section><footer class="footer"><div><h3 id="selected-name">Select a project to continue</h3><p id="selected-path">Choose an active, recent, discovered, or browsed UEFN project.</p><p id="python" class="python"></p></div><button id="continue" class="primary" disabled>Open project in UEM</button></footer></main>
  <script src="/launcher.js"></script>
</body>
</html>
