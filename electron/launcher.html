<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>UEFN Transaction Manager</title>
  <style>
    :root{--bg:#080c14;--header:#080d19;--card:#0f1629;--hover:#15203b;--border:#1e293b;--cyan:#38bdf8;--muted:#94a3b8;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden}.titlebar{height:32px;background:var(--header);display:flex;align-items:stretch;-webkit-app-region:drag}.titlebar-title{display:flex;align-items:center;padding-left:12px;color:#64748b;font-size:10px;font-weight:700;letter-spacing:.08em}.drag{flex:1}.window-button{display:flex;align-items:center;justify-content:center;width:42px;border:0;background:transparent;color:#94a3b8;cursor:pointer;-webkit-app-region:no-drag}.window-button svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.6;fill:none}.window-button:hover{background:#1e293b;color:#fff}.window-button.close{color:#fb7185}.window-button.close:hover{background:#e11d48;color:#fff}header{height:104px;border-bottom:1px solid rgba(30,41,59,.8);background:rgba(8,13,25,.96);padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:13px;min-width:0}.uem-mark{width:44px;height:44px;border-radius:12px}.identity h1{margin:0;font-size:18px;line-height:22px;font-weight:800;letter-spacing:-.02em}.identity p{margin:4px 0 0;color:var(--muted);font-size:12px}.project-chip{display:inline-flex;align-items:center;gap:6px;margin-top:7px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.1);border-radius:8px;padding:3px 8px;color:#7dd3fc;font-size:10px;font-weight:700}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.adept{display:flex;align-items:center;gap:10px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.07);border-radius:12px;padding:8px 12px;color:white;text-decoration:none;white-space:nowrap}.adept:hover{border-color:rgba(56,189,248,.7);background:rgba(56,189,248,.1)}.adept-logo{display:flex;align-items:center;justify-content:center;width:46px;height:26px;overflow:hidden;flex:none}.adept-logo img{display:block;width:42px;height:42px;object-fit:contain;flex:none}.adept small{display:block;color:#64748b;font-size:9px;font-weight:700;letter-spacing:.12em}.adept strong{display:block;margin-top:2px;font-size:12px;letter-spacing:.03em}.capsules{display:flex;align-items:center;gap:8px;flex:none}.discord{display:flex;align-items:center;gap:8px;border:1px solid rgba(119,133,247,.55);background:#5865F2;border-radius:12px;padding:8px 12px;color:#fff;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}.discord:hover{background:#6875f5}.shell{height:calc(100vh - 136px);display:flex;flex-direction:column;padding:22px 30px 18px;gap:14px}.panel{border:1px solid var(--border);background:rgba(15,22,41,.78);border-radius:12px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.18)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;font-size:14px;font-weight:800}.panel-head span{color:#64748b;font-size:11px}.panel-head span.scan-status{color:#7dd3fc}.panel-head span.scan-status::before{content:"";display:inline-block;width:6px;height:6px;margin:0 6px 1px 0;border-radius:50%;background:#38bdf8;animation:scan-pulse 1.4s ease-in-out infinite}@keyframes scan-pulse{0%,100%{opacity:.35;box-shadow:0 0 0 0 rgba(56,189,248,0)}50%{opacity:1;box-shadow:0 0 0 4px rgba(56,189,248,.08)}}.tools{display:flex;gap:9px}.search{height:38px;flex:1;border:1px solid #334155;border-radius:8px;background:#020617;color:#fff;padding:0 12px;font:inherit;outline:0}.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}button.action{height:38px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#e2e8f0;padding:0 13px;font:700 12px inherit;cursor:pointer}button.action:hover{background:#334155}button:disabled{opacity:.45;cursor:not-allowed}.projects{min-height:0;flex:1;overflow:auto;padding:2px}.projects::-webkit-scrollbar{width:8px}.projects::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}.project{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 14px;text-align:left;color:inherit;cursor:pointer;margin-bottom:9px;transition:.12s}.project:hover{background:var(--hover);border-color:rgba(56,189,248,.35)}.project.selected{border-color:rgba(56,189,248,.65);background:rgba(56,189,248,.1)}.project-name{font-weight:800;font-size:13px}.project-path{margin-top:4px;color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{margin-top:7px;color:#64748b;font-size:11px;font-weight:700}.project.selected .project-meta{color:#7dd3fc}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:14px 16px}.footer h3{margin:0;font-size:13px}.footer p{margin:5px 0 0;color:var(--muted);font-size:11px}.footer .python{color:var(--green);font-weight:700}.primary{height:42px;min-width:190px;border:0;border-radius:8px;background:linear-gradient(90deg,#38bdf8,#3b82f6);color:#020617;font:800 12px inherit;cursor:pointer;box-shadow:0 8px 22px rgba(56,189,248,.18)}.primary:hover{background:linear-gradient(90deg,#67e8f9,#60a5fa)}.empty{display:flex;min-height:120px;align-items:center;justify-content:center;border:1px dashed #334155;border-radius:12px;color:#64748b;font-size:12px}
  </style>
  <style>
    .update{position:fixed;right:20px;bottom:20px;z-index:20;width:min(34rem,calc(100vw - 40px));border:1px solid rgba(56,189,248,.3);background:rgba(16,24,44,.96);border-radius:14px;padding:14px 16px;box-shadow:0 16px 44px rgba(0,0,0,.42);backdrop-filter:blur(14px)}.update[hidden]{display:none}.update-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.update-title{font-size:12px;font-weight:800}.update-detail{margin-top:4px;color:#94a3b8;font-size:11px}.update-actions{display:flex;gap:8px;flex:none}.update-actions button{height:32px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#e2e8f0;padding:0 11px;font:700 11px inherit;cursor:pointer}.update-actions button.primary-action{border:0;background:#38bdf8;color:#020617}
  </style>
  <style>
    .adept{height:48px}
    .discord{position:relative;width:48px;height:48px;flex:none;justify-content:center;gap:0;padding:0;border-radius:12px;box-shadow:0 4px 12px rgba(88,101,242,.15);transition:background-color .12s ease,transform .12s ease,box-shadow .12s ease}
    .discord svg{width:30px;height:30px;display:block}
    .discord > span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .discord:focus-visible{outline:2px solid #aab3ff;outline-offset:2px}
    .discord:active{transform:scale(.96)}
    .window-button:focus-visible,.action:focus-visible,.primary:focus-visible,.search:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
    .update-actions button:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
    .update-progress{height:5px;margin-top:10px;overflow:hidden;border-radius:999px;background:#1e293b}
    .update-progress > span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#38bdf8,#3b82f6);transition:width .18s ease}
    .primary{min-width:230px;padding:0 16px;white-space:nowrap}
  </style>
</head>
<body data-uem-launcher-ready>
  <div class="titlebar"><span class="titlebar-title">UTM</span><div class="drag"></div><button id="minimize" class="window-button" aria-label="Minimize"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id="maximize" class="window-button" aria-label="Maximize"><svg viewBox="0 0 16 16"><rect x="3.25" y="3.25" width="9.5" height="9.5" rx=".5"/></svg></button><button id="close" class="window-button close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
  <header><div class="identity"><img class="uem-mark" src="/uem-icon.svg" alt="UEFN Transaction Manager"><div><h1>UEFN Transaction Manager</h1><p>Choose the UEFN project you want to manage.</p><span class="project-chip"><span class="dot"></span>PROJECT LINK</span></div></div><div class="capsules"><a id="adept" class="adept" href="https://adeptinteractive.net" aria-label="Visit ADEPT Interactive"><span class="adept-logo"><img src="/adept-insignia.png" alt=""></span><span><small>CREATED BY</small><strong>ADEPT INTERACTIVE ↗</strong></span></a><a id="discord" class="discord" href="https://discord.gg/playadept" aria-label="Join the ADEPT Interactive Discord server" title="Join Discord"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19.5 5.3A18 0 0 0 15.2 4l-.5 1.1a16.4 16.4 0 0 0-5.4 0L8.7 4a17.7 17.7 0 0 0-4.3 1.3C1.7 9.3 1 13.2 1.4 17a17.5 17.5 0 0 0 5.3 2.7L8 18a11 11 0 0 1-1.7-.8l.4-.3a12.7 12.7 0 0 0 10.6 0l.4.3c-.5.3-1.1.6-1.7.8l1.3 1.7a17.4 17.4 0 0 0 5.3-2.7c.5-4.4-.8-8.3-3.1-11.7ZM8.3 14.7c-1 0-1.9-1-1.9-2.2 0-1.2.8-2.2 1.9-2.2 1 0 1.9 1 1.9 2.2s-.9 2.2-1.9 2.2Zm7.4 0c-1 0-1.9-1-1.9-2.2 0-1.2.8-2.2 1.9-2.2 1 0 1.9 1 1.9 2.2s-.8-2.2-1.9-2.2Z"/></svg><span>Join Discord</span></a></div></header>
  <main class="shell"><section class="panel"><div class="panel-head"><div><h2>Available projects</h2><span id="status">Finding active and recent UEFN projects…</span></div></div><div class="tools"><input id="search" class="search" placeholder="Search projects" autocomplete="off"><button id="browse" class="action">Browse for .uefnproject</button></div></section><section id="update" class="update" hidden><div class="update-row"><div><div id="update-title" class="update-title"></div><div id="update-detail" class="update-detail"></div><div id="update-progress" class="update-progress" hidden><span></span></div></div><div class="update-actions"><button id="update-action" class="primary-action"></button><button id="update-later">Later</button></div></div></section><section id="projects" class="projects" aria-live="polite"></section><footer class="footer"><div><h3 id="selected-name">Select a project to continue</h3><p id="selected-path">Choose an active, recent, discovered, or browsed UEFN project.</p><p id="python" class="python"></p></div><button id="continue" class="primary" disabled>Open project in Transaction Manager</button></footer></main>
  <script src="/launcher.js"></script>
</body>
</html>
