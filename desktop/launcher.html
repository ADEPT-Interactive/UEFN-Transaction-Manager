<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>UEFN Entitlement Manager</title>
<style>
:root{--bg:#080c14;--header:#080d19;--card:#0f1629;--hover:#15203b;--border:#1e293b;--cyan:#38bdf8;--muted:#94a3b8;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden}.titlebar{height:32px;background:var(--header);display:flex;align-items:stretch}.drag{flex:1;-webkit-app-region:drag}.window-button{width:42px;border:0;background:transparent;color:#94a3b8;font-size:16px;cursor:pointer}.window-button:hover{background:#1e293b;color:#fff}.window-button.close{color:#fb7185}.window-button.close:hover{background:#e11d48;color:#fff}header{height:104px;border-bottom:1px solid rgba(30,41,59,.8);background:rgba(8,13,25,.96);padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:13px;min-width:0}.uem-mark{width:44px;height:44px;border-radius:12px}.identity h1{margin:0;font-size:18px;line-height:22px;font-weight:800;letter-spacing:-.02em}.identity p{margin:4px 0 0;color:var(--muted);font-size:12px}.project-chip{display:inline-flex;align-items:center;gap:6px;margin-top:7px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.1);border-radius:8px;padding:3px 8px;color:#7dd3fc;font-size:10px;font-weight:700}.dot{width:6px;height:6px;border-radius:50%;background:#34d399}.adept{display:flex;align-items:center;gap:10px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.07);border-radius:12px;padding:8px 12px;color:white;text-decoration:none;transition:.15s}.adept:hover{border-color:rgba(56,189,248,.7);background:rgba(56,189,248,.1)}.adept img{width:28px;height:28px;object-fit:contain}.adept small{display:block;color:#64748b;font-size:9px;font-weight:700;letter-spacing:.12em}.adept strong{display:block;margin-top:2px;font-size:12px;letter-spacing:.03em}.shell{height:calc(100vh - 136px);display:flex;flex-direction:column;padding:22px 30px 18px;gap:14px}.panel{border:1px solid var(--border);background:rgba(15,22,41,.78);border-radius:12px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.18)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;font-size:14px;font-weight:800}.panel-head span{color:#64748b;font-size:11px}.tools{display:flex;gap:9px}.search{height:38px;flex:1;border:1px solid #334155;border-radius:8px;background:#020617;color:#fff;padding:0 12px;font:inherit;outline:0}.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}button.action{height:38px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#e2e8f0;padding:0 13px;font:700 12px inherit;cursor:pointer}button.action:hover{background:#334155}.projects{min-height:0;flex:1;overflow:auto;padding:2px}.projects::-webkit-scrollbar{width:8px}.projects::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}.project{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 14px;text-align:left;color:inherit;cursor:pointer;margin-bottom:9px;transition:.12s}.project:hover{background:var(--hover);border-color:rgba(56,189,248,.35)}.project.selected{border-color:rgba(56,189,248,.65);background:rgba(56,189,248,.1)}.project-name{font-weight:800;font-size:13px}.project-path{margin-top:4px;color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{margin-top:7px;color:#64748b;font-size:11px;font-weight:700}.project.selected .project-meta{color:#7dd3fc}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:14px 16px}.footer h3{margin:0;font-size:13px}.footer p{margin:5px 0 0;color:var(--muted);font-size:11px}.footer .python{color:var(--green);font-weight:700}.primary{height:42px;min-width:190px;border:0;border-radius:8px;background:linear-gradient(90deg,#38bdf8,#3b82f6);color:#020617;font:800 12px inherit;cursor:pointer;box-shadow:0 8px 22px rgba(56,189,248,.18)}.primary:hover{background:linear-gradient(90deg,#67e8f9,#60a5fa)}.primary:disabled{opacity:.4;cursor:not-allowed}@media(max-width:720px){header{padding:14px 18px}.adept{display:none}.shell{padding:14px 18px}.footer{align-items:flex-start;flex-direction:column}.primary{width:100%}}
.empty{display:flex;min-height:120px;align-items:center;justify-content:center;border:1px dashed #334155;border-radius:12px;color:#64748b;font-size:12px}
</style></head><body>
<header><div class="identity"><img class="uem-mark" src="uem-icon.svg" alt="UEM"><div><h1>UEFN Entitlement Manager</h1><p>Choose the UEFN project you want to manage.</p><span class="project-chip"><span class="dot"></span>PROJECT LINK</span></div></div><a class="adept" href="#" onclick="event.preventDefault();post('open-adept')"><img src="adept-insignia.png" alt=""><span><small>CREATED BY</small><strong>ADEPT INTERACTIVE ↗</strong></span></a></header>
<main class="shell"><section class="panel"><div class="panel-head"><div><h2>Available projects</h2><span id="status">Finding active and recent UEFN projects…</span></div></div><div class="tools"><input id="search" class="search" placeholder="Search projects" oninput="render()"><button class="action" onclick="post('browse')">Browse for .uefnproject</button></div></section><section id="projects" class="projects"></section><footer class="footer"><div><h3 id="selected-name">Select a project to continue</h3><p id="selected-path">Choose an active, recent, discovered, or browsed UEFN project.</p><p id="python" class="python"></p></div><button id="continue" class="primary" disabled onclick="post('continue')">Open project in UEM</button></footer></main>
<script>
const launcherState={projects:[],selectedIndex:-1,status:'Finding active and recent UEFN projects…'};
function post(value){if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage(value)}}
function setLauncherState(next){
  if(!next||!Array.isArray(next.projects))return;
  launcherState.projects=next.projects;
  launcherState.selectedIndex=Number.isInteger(next.selectedIndex)?next.selectedIndex:-1;
  launcherState.status=typeof next.status==='string'?next.status:'';
  render();
}
window.render=function(){
  document.getElementById('status').textContent=launcherState.status;
  const query=document.getElementById('search').value.trim().toLowerCase();
  const list=document.getElementById('projects');
  list.innerHTML='';
  const matches=launcherState.projects.map((p,index)=>({p,index})).filter(({p})=>!query||p.name.toLowerCase().includes(query)||p.projectFile.toLowerCase().includes(query));
  matches.forEach(({p,index})=>{
    const item=document.createElement('button');
    item.type='button';
    item.className='project'+(index===launcherState.selectedIndex?' selected':'');
    item.setAttribute('aria-pressed',String(index===launcherState.selectedIndex));
    item.onclick=()=>post('select:'+index);
    item.innerHTML='<div class="project-name"></div><div class="project-path"></div><div class="project-meta"></div>';
    item.children[0].textContent=p.name;
    item.children[1].textContent=p.projectFile;
    item.children[2].textContent=p.sourceLabel+' · '+(p.pythonEnabled?'Python enabled':'Native imports need Python');
    list.appendChild(item);
  });
  if(matches.length===0){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent=query?'No projects match your search.':'No projects are available yet.';
    list.appendChild(empty);
  }
  const selected=launcherState.projects[launcherState.selectedIndex];
  document.getElementById('continue').disabled=!selected;
  document.getElementById('selected-name').textContent=selected?(selected.isActive?selected.name+' — active in UEFN':selected.name):'Select a project to continue';
  document.getElementById('selected-path').textContent=selected?selected.projectFile:'Choose an active, recent, discovered, or browsed UEFN project.';
  document.getElementById('python').textContent=selected?(selected.pythonEnabled?'Python Editor Scripting is enabled. UEM will install and attach native texture importing automatically.':'Python Editor Scripting is disabled. UEM can still manage Verse; enable it for native texture importing.'):'';
}
if(window.chrome&&window.chrome.webview){window.chrome.webview.addEventListener('message',event=>setLauncherState(event.data))}
render();
post('ready');
</script>
</body></html>
