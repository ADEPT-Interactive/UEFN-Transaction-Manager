<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" role="img" aria-labelledby="title desc">
  <title id="title">Coding agent workflow for a UEFN project</title><desc id="desc">A coding agent connects UTM and Unreal MCP to work with the same UEFN project, then review and compile the result.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091625"/><stop offset="1" stop-color="#090b1b"/></linearGradient><linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142d43"/><stop offset="1" stop-color="#201a3b"/></linearGradient><marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#56dce8"/></marker><marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#9a82ff"/></marker></defs>
  <rect width="640" height="1040" rx="28" fill="url(#background)"/>
  <g><rect x="50" y="58" width="540" height="128" rx="22" fill="url(#agentFill)" stroke="#466e93" stroke-width="2"/><circle cx="104" cy="122" r="27" fill="#091523" stroke="#67e4ed" stroke-width="2"/><path d="M92 122h24M104 110v24" stroke="#67e4ed" stroke-width="3" stroke-linecap="round"/><text x="148" y="115" fill="#f5f9ff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">Coding agent</text><text x="148" y="148" fill="#a9bbcf" font-family="Segoe UI,Arial,sans-serif" font-size="18">Codex · Claude Code · Cursor · others</text></g>
  <path d="M320 186V246" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCyan)"/><path d="M320 212H616V556H320V586" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="50" y="250" width="540" height="260" rx="22" fill="#0d2032" stroke="#3fb9ca" stroke-width="2"/><rect x="76" y="276" width="180" height="32" rx="16" fill="#123747"/><text x="166" y="298" text-anchor="middle" fill="#75e7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">CATALOG</text><text x="76" y="353" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">UTM</text><text x="76" y="404" fill="#b8c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Offers, icons, and generated Verse</text><text x="76" y="443" fill="#b8c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Reviewed in the same workflow</text></g>
  <path d="M320 510V540H24V884H206V918" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)"/>
  <g><rect x="50" y="596" width="540" height="260" rx="22" fill="#15172e" stroke="#7f70df" stroke-width="2"/><rect x="76" y="622" width="198" height="32" rx="16" fill="#2a2548"/><text x="175" y="644" text-anchor="middle" fill="#beadff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">UEFN PROJECT</text><text x="76" y="699" fill="#f7f5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Unreal MCP</text><text x="76" y="750" fill="#c6c2dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Verse, assets, and editor</text><text x="76" y="789" fill="#c6c2dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Compile and inspect the result</text></g>
  <path d="M320 856V918" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="50" y="930" width="540" height="80" rx="22" fill="#111f31" stroke="#38536e" stroke-width="2"/><text x="320" y="962" text-anchor="middle" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">Review and compile</text><text x="320" y="991" text-anchor="middle" fill="#a5b6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Your gameplay stays in your project</text></g>
</svg>
