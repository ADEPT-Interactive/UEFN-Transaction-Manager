<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" role="img" aria-labelledby="title desc">
  <title id="title">Coding agent workflow with UTM MCP and Unreal MCP</title>
  <desc id="desc">An MCP-compatible coding agent connects to UTM MCP for the transaction domain and Unreal MCP for the UEFN editor domain. Both tools contribute to the same UEFN project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091625"/><stop offset="1" stop-color="#090b1b"/></linearGradient>
    <linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142d43"/><stop offset="1" stop-color="#201a3b"/></linearGradient>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#56dce8"/></marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#9a82ff"/></marker>
  </defs>
  <rect width="640" height="1040" rx="28" fill="url(#background)"/><text x="320" y="34" text-anchor="middle" fill="#7489a3" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">ONE AGENT · TWO RESPONSIBILITIES</text>
  <g><rect x="50" y="58" width="540" height="128" rx="22" fill="url(#agentFill)" stroke="#466e93" stroke-width="2"/><circle cx="104" cy="122" r="27" fill="#091523" stroke="#67e4ed" stroke-width="2"/><path d="M92 122h24M104 110v24" stroke="#67e4ed" stroke-width="3" stroke-linecap="round"/><text x="148" y="115" fill="#f5f9ff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">MCP-compatible coding agent</text><text x="148" y="148" fill="#a9bbcf" font-family="Segoe UI,Arial,sans-serif" font-size="18">Codex · Claude Code · Cursor · others</text></g>
  <path d="M320 186V246" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCyan)"/><path d="M320 212H616V524H320V560" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="50" y="250" width="540" height="238" rx="22" fill="#0d2032" stroke="#3fb9ca" stroke-width="2"/><rect x="76" y="276" width="140" height="32" rx="16" fill="#123747"/><text x="146" y="298" text-anchor="middle" fill="#75e7ef" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">TRANSACTIONS</text><text x="76" y="353" fill="#f4fbff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">UTM MCP</text><text x="76" y="398" fill="#b8c8d8" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Catalog and offers</text><text x="76" y="435" fill="#b8c8d8" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Validation and icons</text><text x="76" y="472" fill="#b8c8d8" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Generated contract</text></g>
  <path d="M320 488V520H24V846H206V884" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)"/>
  <g><rect x="50" y="564" width="540" height="238" rx="22" fill="#15172e" stroke="#7f70df" stroke-width="2"/><rect x="76" y="590" width="132" height="32" rx="16" fill="#2a2548"/><text x="142" y="612" text-anchor="middle" fill="#beadff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">UEFN EDITOR</text><text x="76" y="667" fill="#f7f5ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Unreal MCP</text><text x="76" y="712" fill="#c6c2dc" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Verse and files</text><text x="76" y="749" fill="#c6c2dc" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Assets and devices</text><text x="76" y="786" fill="#c6c2dc" font-family="Segoe UI,Arial,sans-serif" font-size="22">• Compile and sessions</text></g>
  <path d="M320 802V884" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="50" y="888" width="540" height="118" rx="22" fill="#111f31" stroke="#38536e" stroke-width="2"/><text x="320" y="934" text-anchor="middle" fill="#f5f9ff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">Your UEFN project</text><text x="320" y="971" text-anchor="middle" fill="#a5b6ca" font-family="Segoe UI,Arial,sans-serif" font-size="19">Gameplay and business logic stay in your Verse</text></g>
</svg>
