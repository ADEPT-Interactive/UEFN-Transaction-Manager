<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Coding agent workflow for a UEFN project</title><desc id="desc">A coding agent connects UTM and Unreal MCP to work with the same UEFN project, then review and compile the result.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091625"/><stop offset="1" stop-color="#090b1b"/></linearGradient><linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142d43"/><stop offset="1" stop-color="#201a3b"/></linearGradient><marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#56dce8"/></marker><marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#9a82ff"/></marker></defs>
  <rect width="1120" height="640" rx="28" fill="url(#background)"/><path d="M1 90H1119M1 550H1119" stroke="#172940"/>
  <g><rect x="270" y="78" width="580" height="112" rx="22" fill="url(#agentFill)" stroke="#466e93" stroke-width="2"/><circle cx="326" cy="134" r="27" fill="#091523" stroke="#67e4ed" stroke-width="2"/><path d="M314 134h24M326 122v24" stroke="#67e4ed" stroke-width="3" stroke-linecap="round"/><text x="372" y="127" fill="#f5f9ff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">Coding agent</text><text x="372" y="158" fill="#a9bbcf" font-family="Segoe UI,Arial,sans-serif" font-size="17">Codex · Claude Code · Cursor · others</text></g>
  <path d="M560 190V210H295V236" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)"/><path d="M560 190V210H825V236" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="70" y="240" width="450" height="228" rx="22" fill="#0d2032" stroke="#3fb9ca" stroke-width="2"/><rect x="92" y="263" width="160" height="28" rx="14" fill="#123747"/><text x="172" y="282" text-anchor="middle" fill="#75e7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.4">CATALOG</text><text x="98" y="334" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">UTM</text><text x="98" y="381" fill="#b8c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Offers, icons, and generated Verse</text><text x="98" y="415" fill="#b8c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Reviewed in the same workflow</text></g>
  <g><rect x="600" y="240" width="450" height="228" rx="22" fill="#15172e" stroke="#7f70df" stroke-width="2"/><rect x="622" y="263" width="198" height="28" rx="14" fill="#2a2548"/><text x="721" y="282" text-anchor="middle" fill="#beadff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.4">UEFN PROJECT</text><text x="628" y="334" fill="#f7f5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Unreal MCP</text><text x="628" y="381" fill="#c6c2dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Verse, assets, and editor</text><text x="628" y="415" fill="#c6c2dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Compile and inspect the result</text></g>
  <path d="M295 468V490H452V514" fill="none" stroke="#56dce8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)"/><path d="M825 468V490H668V514" fill="none" stroke="#9a82ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <g><rect x="250" y="518" width="620" height="92" rx="21" fill="#111f31" stroke="#38536e" stroke-width="2"/><text x="560" y="556" text-anchor="middle" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Review and compile</text><text x="560" y="584" text-anchor="middle" fill="#a5b6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Your gameplay stays in your project</text></g>
</svg>
