<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UTM and Unreal MCP workflow</title>
  <desc id="desc">A coding agent connects to UTM MCP for transaction catalog work and Unreal MCP for UEFN editor work; both meet in the same UEFN project.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55E6F0"/>
      <stop offset=".55" stop-color="#3188FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172b46"/>
      <stop offset="1" stop-color="#1c183d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#6edeea"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#080f1d"/>
  <path d="M70 85h1060M70 595h1060" stroke="#17263d"/>
  <text x="70" y="55" fill="#6f849f" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">UTM 4.3 · TWO COMPLEMENTARY PROJECT SURFACES</text>

  <g filter="url(#shadow)">
    <rect x="330" y="110" width="540" height="116" rx="22" fill="url(#agent)" stroke="url(#edge)" stroke-width="2"/>
    <circle cx="380" cy="168" r="26" fill="#0d1729" stroke="#55e6f0" stroke-width="2"/>
    <path d="M369 168h22M380 157v22" stroke="#55e6f0" stroke-width="3" stroke-linecap="round"/>
    <text x="430" y="157" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">Coding agent</text>
    <text x="430" y="188" fill="#a8bad2" font-family="Segoe UI,Arial,sans-serif" font-size="18">Codex · Claude Code · Cursor</text>
  </g>

  <path d="M600 226v55M600 281L300 346M600 281l300 65" fill="none" stroke="#63dce8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="350" width="420" height="170" rx="22" fill="#0e1a2d" stroke="#3ab8d0" stroke-width="2"/>
    <rect x="690" y="350" width="420" height="170" rx="22" fill="#11182f" stroke="#8271ef" stroke-width="2"/>
    <text x="130" y="396" fill="#65e4ef" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">UTM MCP</text>
    <text x="130" y="427" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Transactions</text>
    <text x="130" y="454" fill="#b5c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Catalog · validation · icons</text>
    <text x="130" y="480" fill="#b5c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Generated integration contract</text>
    <text x="730" y="396" fill="#b49bff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Unreal MCP</text>
    <text x="730" y="427" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">UEFN editor</text>
    <text x="730" y="454" fill="#c1c8dd" font-family="Segoe UI,Arial,sans-serif" font-size="16">Verse · assets · devices</text>
    <text x="730" y="480" fill="#c1c8dd" font-family="Segoe UI,Arial,sans-serif" font-size="16">Compile · supported editor actions</text>
  </g>

  <path d="M300 520v36M900 520v36M300 556h600" fill="none" stroke="#63dce8" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="280" y="555" width="640" height="78" rx="20" fill="#101c2d" stroke="#2d4865" stroke-width="2"/>
    <text x="600" y="588" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Your UEFN project</text>
    <text x="600" y="614" text-anchor="middle" fill="#9db0c9" font-family="Segoe UI,Arial,sans-serif" font-size="15">The agent coordinates both surfaces while gameplay stays in your Verse</text>
  </g>
</svg>
